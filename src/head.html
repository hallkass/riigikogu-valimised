<style>
:root {
  /* Paigutus: tööriistaleht — päis, kokkuvõte (poolring + erakonnatabel), vahekaardid; kuni 1200px, kitsal ekraanil üks veerg */
  --paper: #f2f5f8;
  --surface: #ffffff;
  --sunk: #e8edf2;
  --ink: #0f1b2b;
  --ink-2: #455468;
  --ink-3: #6f7f93;
  --rule: #d3dbe4;
  --rule-2: #b3c0ce;
  --accent: #0b63b6;
  --accent-ink: #ffffff;
  --accent-soft: #e1edf9;
  --ok: #16784a;
  --ok-soft: #e0f2e8;
  --warn: #965700;
  --warn-soft: #fbefd8;
  --bad: #b1261d;
  --bad-soft: #fbe4e1;
  --pen: #1f45a3;
  --seat-edge: rgba(15, 27, 43, .3);
  --shadow: 0 1px 2px rgba(15, 27, 43, .06), 0 6px 20px rgba(15, 27, 43, .06);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1118; --surface: #121a24; --sunk: #0e151d; --ink: #e7edf4; --ink-2: #a8b5c5; --ink-3: #8090a2;
    --rule: #223041; --rule-2: #364a5e; --accent: #62a9f3; --accent-ink: #06121f; --accent-soft: #14304d;
    --ok: #52c78f; --ok-soft: #10301f; --warn: #f2a84d; --warn-soft: #33240c; --bad: #f47b70; --bad-soft: #3a1613;
    --pen: #9bbcff; --seat-edge: rgba(255, 255, 255, .25); --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1118; --surface: #121a24; --sunk: #0e151d; --ink: #e7edf4; --ink-2: #a8b5c5; --ink-3: #8090a2;
  --rule: #223041; --rule-2: #364a5e; --accent: #62a9f3; --accent-ink: #06121f; --accent-soft: #14304d;
  --ok: #52c78f; --ok-soft: #10301f; --warn: #f2a84d; --warn-soft: #33240c; --bad: #f47b70; --bad-soft: #3a1613;
  --pen: #9bbcff; --seat-edge: rgba(255, 255, 255, .25); --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { margin: 0 auto; padding-left: max(16px, 1.6vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 1.6vw, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4.2vw, 2.9rem); font-weight: 750; line-height: 1.05; }
h2 { font-size: 1.35rem; font-weight: 700; line-height: 1.2; }

p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-2); }
.small { font-size: .84rem; }
.eyebrow { font: 600 .74rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* nupud */
.btn { display: inline-flex; align-items: center; gap: .4em; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: .42em .8em; font-size: .88rem; font-weight: 500; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunk); border-color: transparent; }
.btn-sm { font-size: .8rem; padding: .28em .6em; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }

/* päis */
.top { padding-block: 28px 18px; }
.top-row { display: flex; flex-wrap: wrap; gap: 18px 32px; align-items: flex-end; justify-content: space-between; }
.brand { min-width: 0; max-width: 46rem; display: grid; gap: 10px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: .45em; font-size: .8rem; font-weight: 600; padding: .32em .7em; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.badge.is-mod { background: var(--warn-soft); color: var(--warn); }
.badge::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: currentColor; }

/* kokkuvõte */
.summary { display: grid; grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); gap: 18px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.hemi-card { padding: 16px 18px 14px; display: grid; gap: 12px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); grid-template-areas: "hemi" "legend" "warns" "kpis"; }
.hemi { grid-area: hemi; width: 100%; height: auto; display: block; max-width: min(100%, 560px); justify-self: center; }
.legend { grid-area: legend; }
.warns { grid-area: warns; }
.kpis { grid-area: kpis; }
.seat { cursor: pointer; }
.seat-D { stroke: var(--seat-edge); }
.seat:hover { filter: brightness(1.12); }
.hemi-n { font: 750 0.26px/1 var(--f-display); fill: var(--ink); text-anchor: middle; }
.hemi-l { font: 500 0.062px/1 var(--f-body); fill: var(--ink-2); text-anchor: middle; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.g { width: 13px; height: 13px; flex: none; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
.kpi { display: grid; gap: 2px; min-width: 0; }
.kpi b { font: 650 1.15rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi small { color: var(--ink-3); font-size: .76rem; }
.warns { display: grid; gap: 6px; }
.warn { font-size: .84rem; padding: .45em .7em; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.party-card { padding: 6px 0 4px; min-width: 0; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
.tbl th, .tbl td { padding: .45rem .6rem; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tbl thead th { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 600; border-top: 1px solid var(--rule-2); border-bottom: 0; }
.pname { display: flex; align-items: center; gap: 9px; min-width: 0; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); flex: none; box-shadow: inset 0 0 0 1px var(--seat-edge); }
.ptable .pfull { font-weight: 600; }
.ptable .pshort { color: var(--ink-3); font-size: .78rem; }
.ptable tr.below td { color: var(--ink-3); }
.ptable tr.below .pfull { font-weight: 500; }
.seatbar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--sunk); min-width: 70px; }
.seatbar i { display: block; height: 100%; }
.total { font: 700 1.05rem/1 var(--f-display); }
.delta { font-size: .76rem; font-weight: 600; margin-left: 4px; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; padding: .1em .45em; border-radius: 4px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.tag.warn-tag { background: var(--warn-soft); color: var(--warn); }
.tag.ok-tag { background: var(--ok-soft); color: var(--ok); }

/* häälte protsendiline muutmine */
.ptools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding: 8px 12px 8px 14px; border-bottom: 1px solid var(--rule); font-size: .8rem; color: var(--ink-2); }
.stepper { display: inline-flex; align-items: center; gap: 0; font-size: .76rem; color: var(--ink-3); }
.stepper > span { margin-right: 6px; }
.stepper button { border: 1px solid var(--rule-2); background: var(--surface); padding: .18em .55em; font-size: .76rem; font-weight: 600; color: var(--ink-2); margin-left: -1px; }
.stepper button:first-of-type { border-radius: 5px 0 0 5px; margin-left: 0; }

.stepper button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); position: relative; }
.adj { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.adjb { border: 1px solid var(--rule-2); background: var(--surface); border-radius: 5px; padding: .14em .42em; font: 600 .74rem/1.25 var(--f-mono); color: var(--ink-2); }
.adjb:hover { border-color: var(--ink-3); color: var(--ink); }
.adjr { font-family: var(--f-body); }
.adjd { font: 600 .72rem/1 var(--f-mono); padding-left: 3px; font-variant-numeric: tabular-nums; }
.adjd.up { color: var(--ok); }
.adjd.down { color: var(--bad); }
.plink { background: none; border: 0; padding: 0; text-align: left; font: inherit; font-weight: 600; color: var(--ink); }
.plink:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.ptable .plink { font-weight: 600; }
.ptable tr.below .plink { font-weight: 500; color: var(--ink-3); }
.ptable td, .ptable th { padding-left: .5rem; padding-right: .5rem; }
.ptable { table-layout: fixed; min-width: 780px; }
.dptable { table-layout: fixed; min-width: 700px; }
.ptable td:first-child, .dptable td:first-child { overflow-wrap: anywhere; }
.frz { color: var(--accent); font-weight: 500; }

.pct-below { color: var(--warn); font-weight: 600; }
.dptable td:nth-child(5) { white-space: nowrap; }
.dsec { margin: 18px 0 14px; overflow: hidden; }
.dsec-h { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between; padding: 14px 14px 12px; border-bottom: 1px solid var(--rule); }
.dptable td, .dptable th { padding-top: .38rem; padding-bottom: .38rem; }

/* süvavaade */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 16px; font-size: .9rem; }
.crumb { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.crumb-cur { font-weight: 600; }
.crumbs .sep { color: var(--ink-3); }
.zhead { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
.zhead h2 { display: flex; align-items: center; gap: 10px; }
.zgrid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.zgrid > *, .zsec, .hcard { min-width: 0; }
.zsec, .step, .steps, .hcard, .dlg-b, .dsub, .checks, .brand { grid-template-columns: minmax(0, 1fr); }
.zsec > *, .step > *, .steps > *, .hcard > * { min-width: 0; }
.zgrid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 780px), 1fr)); align-items: start; }
.zsec { display: grid; gap: 8px; }
.zsec-h { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.sortbar { display: inline-flex; align-items: center; font-size: .78rem; color: var(--ink-3); gap: 0; }
.sortbar > span { margin-right: 6px; }
.sortbar button { border: 1px solid var(--rule-2); background: var(--surface); padding: .18em .6em; font-size: .76rem; font-weight: 600; color: var(--ink-2); margin-left: -1px; }
.sortbar button:first-of-type { border-radius: 5px 0 0 5px; margin-left: 0; }
.sortbar button:last-of-type { border-radius: 0 5px 5px 0; }
.sortbar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: var(--sunk); }
.rk { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar { display: inline-block; vertical-align: middle; width: 64px; height: 7px; border-radius: 2px; background: var(--sunk); overflow: hidden; margin-left: 8px; }
.bar i { display: block; height: 100%; background: var(--pc, var(--accent)); }
.comp-row { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.comp-row div { display: grid; gap: 1px; }
.comp-row dt { font-size: .7rem; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
.comp-row dd { margin: 0; font: 600 1.02rem/1.25 var(--f-body); font-variant-numeric: tabular-nums; }
.comp-row dd small { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-3); }
.znote { font-size: .82rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: .45em .7em; margin-bottom: 14px; max-width: 80ch; }
.nb-sm { font: 600 .74rem/1 var(--f-mono); color: var(--pen); border: 1px solid var(--rule-2); border-radius: 3px; padding: .2em .3em; margin-right: 6px; display: inline-block; min-width: 2.9em; text-align: center; }

/* paber- ja e-hääled */
.heat td.hv { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.heat th.pcol { text-align: right; }
.heat th.pcol .pname { justify-content: flex-end; }
.diffp { font-weight: 600; }
.diffp.up { color: var(--accent); }
.diffp.down { color: var(--warn); }
.mselect { display: flex; flex-wrap: wrap; gap: 6px; }
.mselect button, .mselect button:first-of-type, .mselect button:last-of-type { margin-left: 0; border-radius: 5px; }

/* ajalugu */
.yearsel { width: auto; font-weight: 600; font-size: .86rem; padding: .36em .5em; }
.hlist { display: grid; gap: 2px; max-height: 340px; overflow: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); padding: 4px; }
.hitem { display: grid; gap: 1px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 10px; }
.hitem:hover, .hitem:focus-visible { background: var(--sunk); }
.hcard { padding: 14px 16px 8px; display: grid; gap: 10px; margin-top: 12px; }
.hnote { max-width: 90ch; }
.hsel { width: auto; max-width: 100%; font-size: .8rem; padding: .2em .4em; margin-top: 4px; display: block; }
.htable td { vertical-align: top; }
.htable td .tag { margin-top: 3px; margin-right: 6px; }
.htable td .link { margin-top: 3px; }
.hrow-empty td { color: var(--ink-3); background: var(--sunk); }
.hctxbar { display: flex; justify-content: flex-end; margin-bottom: -4px; }
.htable tr.hdata td { border-bottom: 0; }
.hctxrow td { padding-top: 0; padding-bottom: .35rem; }
.hctxrow details { position: sticky; left: 0; max-width: calc(100vw - 56px); }
.hctx summary { cursor: pointer; font-size: .8rem; color: var(--accent); padding: 2px 0 6px; width: fit-content; }
.hctx summary:hover { text-decoration: underline; text-underline-offset: 2px; }
.hctxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; padding: 4px 0 10px; }
.hpcard { border: 1px solid var(--rule); border-left: 4px solid var(--pc); border-radius: 6px; background: var(--surface); padding: 7px 9px 4px; min-width: 0; }
.hpc-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; align-items: baseline; font-size: .84rem; margin-bottom: 2px; }
.hmini { font-size: .76rem; }
.hmini th, .hmini td { padding: .22rem .3rem; }
.hmini thead th { font-size: .64rem; }
.hmini td .g { width: 10px; height: 10px; vertical-align: -1px; }
.hmini .plink { font-weight: 500; }
.hmini tr.self td { background: var(--accent-soft); }
.hmini tr.gap td { border-top: 1px dashed var(--rule-2); }
.hsugg { border-top: 1px solid var(--rule); padding: 10px 0 4px; }
.hsugg ul { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 3px; }
.hdet { margin-top: 10px; }
.hdet summary { cursor: pointer; font-weight: 600; font-size: .9rem; padding: 6px 0; }

/* vahekaardid */
.tabs { display: flex; gap: 2px; margin-top: 26px; border-bottom: 1px solid var(--rule-2); overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7em .95em .6em; font-weight: 600; font-size: .93rem; color: var(--ink-2); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding-block: 20px 56px; }
.panel-intro { color: var(--ink-2); max-width: 75ch; margin-bottom: 16px; }

/* ringkonna valik */
.dpicker { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.dpick { display: grid; gap: 3px; text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 7px 9px 8px; min-width: 0; }
.dpick:hover { border-color: var(--rule-2); }
.dpick.is-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dp-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.dp-nr { font: 700 1.05rem/1 var(--f-display); }
.dp-m { font-size: .72rem; color: var(--ink-3); white-space: nowrap; }
.dp-name { font-size: .76rem; color: var(--ink-2); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-bar { display: flex; height: 5px; border-radius: 2px; overflow: hidden; background: var(--sunk); gap: 1px; }
.dp-bar i { display: block; height: 100%; }
.dp-bar i.comp { background: repeating-linear-gradient(135deg, var(--rule-2) 0 2px, transparent 2px 4px); }

.dhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; margin: 22px 0 12px; }
.dhead-t { display: grid; gap: 4px; min-width: 0; }
.dstats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
.dstats div { display: grid; gap: 1px; }
.dstats dt { font-size: .72rem; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.dstats dd { margin: 0; font: 600 1rem/1.25 var(--f-body); font-variant-numeric: tabular-nums; }
.dstats dd small { font-weight: 400; color: var(--ink-3); font-size: .74rem; display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; padding: 10px 12px; background: var(--sunk); border-radius: var(--r); }
.tools label { font-size: .82rem; color: var(--ink-2); }
.tools .grow { flex: 1 1 240px; min-width: 0; position: relative; }
.inp { border: 1px solid var(--rule-2); background: var(--surface); border-radius: 6px; padding: .4em .6em; font-size: .9rem; width: 100%; }
select.inp { width: auto; }
.qres { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: var(--shadow); max-height: 320px; overflow: auto; padding: 4px; }
.qres button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; }
.qres button:hover, .qres button:focus-visible { background: var(--sunk); }
.qres .qm { grid-column: 2; font-size: .76rem; color: var(--ink-3); }

/* erakonna plokk */
